/* ---------------------------------------------------------------------------
 * Model: parse the C4 blocks, link levels through boundary aliases, and give
 * every element a dotted path. RealDocs would do this at build time.
 * ------------------------------------------------------------------------- */
const elementKinds = /^(Person(?:_Ext)?|System(?:Db|Queue)?(?:_Ext)?|Container(?:Db|Queue)?(?:_Ext)?|Component(?:Db|Queue)?(?:_Ext)?)$/;
function splitArgs(text) {
  const out = []; let cur = '', quoted = false;
  for (const ch of text) {
    if (ch === '"') { quoted = !quoted; continue; }
    if (ch === ',' && !quoted) { out.push(cur.trim()); cur = ''; continue; }
    cur += ch;
  }
  out.push(cur.trim());
  return out;
}
function parse(source) {
  const lines = source.text.split('\n');
  const view = { ...source, type: lines[0].trim(), title: '', boundary: null, boundaryKind: null, boundaryLabel: '',
    elements: new Map(), inside: new Set(), rels: [], layout: null, relStyles: [] };
  let depth = 0;
  for (const raw of lines.slice(1)) {
    const line = raw.trim();
    if (line.startsWith('title ')) { view.title = line.slice(6); continue; }
    if (line === '}') { depth--; continue; }
    const call = /^(\w+)\((.*)\)\s*(\{)?$/.exec(line);
    if (!call) continue;
    const [, fn, argText, open] = call;
    const args = splitArgs(argText);
    if (open) { // boundary
      if (!view.boundary) Object.assign(view, { boundary: args[0], boundaryKind: fn, boundaryLabel: args[1] });
      depth++; continue;
    }
    if (elementKinds.test(fn)) {
      const tech = /^(Container|Component)/.test(fn) ? args[2] : '';
      const descr = /^(Container|Component)/.test(fn) ? args[3] : args[2];
      view.elements.set(args[0], { alias: args[0], fn, label: args[1], tech, descr, line: raw.trim() });
      if (depth > 0) view.inside.add(args[0]);
    } else if (/^(Bi)?Rel/.test(fn)) {
      view.rels.push({ fn, from: args[0], to: args[1], label: args[2] || '', tech: args[3] || '', line: raw.trim() });
    } else if (fn === 'UpdateLayoutConfig') view.layout = line;
    else if (fn === 'UpdateRelStyle') view.relStyles.push(line);
  }
  return view;
}

const views = sources.map(parse);
const levels = new Map(); // key: boundary alias ('' = context)
for (const view of views) {
  const key = view.boundary ?? '';
  if (!levels.has(key)) levels.set(key, { key, views: [] });
  levels.get(key).views.push(view);
}
const elements = new Map(); // alias -> element with path
function register(el, path) {
  if (elements.has(el.alias)) {
    const known = elements.get(el.alias);
    known.descriptions.add(el.descr);
    if (!known.tech && el.tech) known.tech = el.tech;
    return known;
  }
  const entry = { ...el, path, descriptions: new Set([el.descr]) };
  elements.set(el.alias, entry);
  return entry;
}
for (const view of levels.get('')?.views ?? []) for (const el of view.elements.values()) register(el, el.alias);
let pending = [...levels.values()].filter(level => level.key);
while (pending.length) {
  const ready = pending.filter(level => elements.has(level.key));
  if (!ready.length) break;
  for (const level of ready) {
    const parent = elements.get(level.key);
    level.path = parent.path;
    for (const view of level.views) for (const el of view.elements.values())
      if (view.inside.has(el.alias)) register(el, `${parent.path}.${el.alias}`);
    for (const view of level.views) for (const el of view.elements.values())
      if (!view.inside.has(el.alias)) register(el, el.alias);
  }
  pending = pending.filter(level => !ready.includes(level));
}
levels.get('').path = '';
for (const el of elements.values()) el.hasChildren = levels.has(el.alias);

function levelSource(level, variant) {
  const chosen = variant == null ? level.views : [level.views[variant]];
  const first = chosen[0];
  if (chosen.length === 1) return first.text;
  const outside = new Map(), inside = new Map(), rels = new Map();
  for (const view of chosen) {
    for (const el of view.elements.values()) (view.inside.has(el.alias) ? inside : outside).set(el.alias, el.line);
    for (const rel of view.rels) if (!rels.has(rel.from + '>' + rel.to)) rels.set(rel.from + '>' + rel.to, rel.line);
  }
  for (const alias of inside.keys()) outside.delete(alias);
  const title = first.title.split(':')[0] + (chosen.length > 1 ? ' (all views merged)' : '');
  return [first.type, `title ${title}`, ...outside.values(),
    `${first.boundaryKind}(${first.boundary}, "${first.boundaryLabel}") {`, ...[...inside.values()].map(l => '  ' + l), '}',
    ...rels.values(), first.layout ?? ''].join('\n');
}

/* ---------------------------------------------------------------------------
 * Rendering
 * ------------------------------------------------------------------------- */
const $ = sel => document.querySelector(sel);
const css = getComputedStyle(document.documentElement);
const color = name => css.getPropertyValue('--wiki-' + name).trim();
mermaid.initialize({
  startOnLoad: false, securityLevel: 'strict', theme: 'base',
  themeVariables: { darkMode: true, background: color('surface'), primaryColor: '#284137', primaryTextColor: color('ink'),
    primaryBorderColor: '#698d7e', lineColor: color('muted'), textColor: color('ink'), secondaryColor: '#2c3a4c',
    tertiaryColor: color('surface'), edgeLabelBackground: color('surface'), fontFamily: 'system-ui, sans-serif',
    actorBkg: '#284137', actorBorder: '#698d7e', actorTextColor: color('ink'), signalColor: color('muted'), signalTextColor: color('ink'),
    noteBkgColor: '#2c3a4c', noteTextColor: color('ink') },
  c4: { person_bg_color: '#285b4a', person_border_color: '#619b86', system_bg_color: '#315a72', system_border_color: '#7099af',
    container_bg_color: '#315a72', container_border_color: '#7099af', component_bg_color: '#2e5144', component_border_color: '#619b86' },
});

let renderCount = 0;
const state = { stack: [''], variant: null, selected: null, tab: 'overview' };
const canvas = $('.canvas');
const levelNames = { C4Context: 'Level 1 · System context', C4Container: 'Level 2 · Containers', C4Component: 'Level 3 · Components' };
const currentLevel = () => levels.get(state.stack.at(-1));
// A level built from several authored views opens on the first one; "All merged" is a toggle.
const defaultVariant = () => currentLevel().views.length > 1 ? 0 : null;
// Every element has one place in the hierarchy: its dotted path. Navigation follows that path,
// never the route the reader took, so a peer that links back cannot grow the breadcrumb.
const stackFor = alias => ['', ...elements.get(alias).path.split('.')];
const isDescendant = alias => state.stack.every((key, i) => stackFor(alias)[i] === key);
const nodeFor = alias => canvas.querySelector(`.c4-shape[data-alias="${CSS.escape(alias)}"]`);
const shapeRect = node => node.querySelector('rect.label-container, .label-container rect');

function setStroke(node, on) {
  const rect = shapeRect(node);
  if (!rect) return;
  if (on) { rect.style.setProperty('stroke', color('accent'), 'important'); rect.style.setProperty('stroke-width', '4', 'important'); }
  else { rect.style.removeProperty('stroke-width'); rect.style.setProperty('stroke', rect.dataset.stroke, 'important'); }
}

async function renderLevel() {
  const level = currentLevel();
  const id = `c4v${++renderCount}`;
  const { svg } = await mermaid.render(id, levelSource(level, state.variant));
  canvas.innerHTML = svg;
  for (const node of canvas.querySelectorAll('.c4-shape')) {
    const alias = node.id.slice(id.length + 1);
    const el = elements.get(alias);
    node.dataset.alias = alias;
    node.setAttribute('tabindex', '0');
    node.setAttribute('role', 'button');
    const down = el?.hasChildren && isDescendant(alias);
    node.setAttribute('aria-label', `${el?.label ?? alias}${el?.hasChildren ? (down ? ', can zoom in' : ', can go to its own view') : ''}`);
    const rect = shapeRect(node);
    if (rect) rect.dataset.stroke = rect.style.getPropertyValue('stroke');
    if (el?.hasChildren && rect) {
      node.classList.add('has-children');
      const x = +rect.getAttribute('x') + +rect.getAttribute('width') - 16, y = +rect.getAttribute('y') + 16;
      node.insertAdjacentHTML('beforeend', `<g class="zoom-badge" transform="translate(${x} ${y})">
        <circle r="10" fill="${color('page')}" stroke="${color('accent')}" stroke-width="1.5"/>
        ${down ? `<path d="M-5 0H5M0 -5V5" stroke="${color('accent')}" stroke-width="2"/>`
               : `<path d="M-4 4L4 -4M-2 -4H4V2" stroke="${color('accent')}" stroke-width="1.8" fill="none"/>`}</g>`);
    }
    if (alias === state.selected) setStroke(node, true);
  }
  renderChrome();
}

function renderChrome() {
  const level = currentLevel();
  const crumbs = state.stack.map((key, index) => {
    const label = key ? elements.get(key).label : 'Context';
    const last = index === state.stack.length - 1;
    return `${index ? '<span class="sep">›</span>' : ''}<button type="button" data-depth="${index}" ${last ? 'aria-current="page"' : ''}>${label}</button>`;
  });
  $('nav.crumbs').innerHTML = crumbs.join('');
  saveHash();
  $('.level').textContent = levelNames[level.views[0].type] ?? level.views[0].type;
  const variants = $('.variants');
  variants.innerHTML = level.views.length > 1 ? [
    `<button type="button" data-variant="" aria-pressed="${state.variant == null}">All merged</button>`,
    ...level.views.map((view, i) => `<button type="button" data-variant="${i}" aria-pressed="${state.variant === i}">${view.variant ?? view.title}</button>`),
  ].join('') : '';
}

const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
let busy = false;
async function transition(next, { into, outOf, slide } = {}) {
  if (busy) return; busy = true;
  // A level change closes the panel; the selected box is usually not on the next level.
  if (state.selected) closePanel({ restoreFocus: false });
  const stage = $('.stage').getBoundingClientRect();
  const focus = into && nodeFor(into);
  if (slide) {
    canvas.style.transformOrigin = 'center'; canvas.style.transform = 'translateX(-12%)';
  } else if (focus) {
    const r = focus.getBoundingClientRect();
    canvas.style.transformOrigin = `${r.left + r.width / 2 - stage.left}px ${r.top + r.height / 2 - stage.top}px`;
    const scale = Math.min(stage.width / r.width, stage.height / r.height) * .8;
    canvas.style.transform = `scale(${scale})`;
  } else {
    canvas.style.transformOrigin = 'center'; canvas.style.transform = 'scale(.55)';
  }
  canvas.style.opacity = '0';
  await wait(380);
  next();
  state.variant = defaultVariant();
  await renderLevel();
  canvas.classList.add('instant');
  const back = outOf && nodeFor(outOf);
  if (slide) {
    canvas.style.transformOrigin = 'center'; canvas.style.transform = 'translateX(12%)';
  } else if (back) {
    const r = back.getBoundingClientRect();
    canvas.style.transformOrigin = `${r.left + r.width / 2 - stage.left}px ${r.top + r.height / 2 - stage.top}px`;
    canvas.style.transform = `scale(${Math.min(stage.width / r.width, stage.height / r.height) * .8})`;
  } else {
    canvas.style.transformOrigin = 'center'; canvas.style.transform = 'scale(.55)';
  }
  canvas.getBoundingClientRect();
  canvas.classList.remove('instant');
  canvas.style.transform = 'none'; canvas.style.opacity = '1';
  await wait(380);
  busy = false;
}
function zoomIn(alias) {
  if (!elements.get(alias)?.hasChildren) return;
  const target = stackFor(alias);
  if (isDescendant(alias)) transition(() => { state.stack = target; }, { into: alias });
  else transition(() => { state.stack = target; }, { slide: true });
}
function zoomOut(depth = state.stack.length - 2) {
  if (depth < 0 || depth >= state.stack.length - 1) return;
  const from = state.stack[depth + 1];
  transition(() => { state.stack = state.stack.slice(0, depth + 1); }, { outOf: from });
}

/* ---------------------------------------------------------------------------
 * Panel
 * ------------------------------------------------------------------------- */
const panel = $('aside.panel');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const tabs = [['overview', 'Overview'], ['diagrams', 'Diagrams'], ['docs', 'Docs'], ['code', 'Code']];

function select(alias) {
  if (state.selected) { const old = nodeFor(state.selected); if (old) setStroke(old, false); }
  state.selected = alias;
  const node = nodeFor(alias); if (node) setStroke(node, true);
  state.tab = 'overview';
  renderPanel();
  panel.classList.add('open');
}
function closePanel({ restoreFocus = true } = {}) {
  if (state.selected) { const old = nodeFor(state.selected); if (old) setStroke(old, false); if (restoreFocus) old?.focus(); }
  state.selected = null;
  panel.classList.remove('open');
  saveHash();
}

function renderPanel() {
  const el = elements.get(state.selected);
  const items = markers.filter(m => m.target === el.path);
  const counts = Object.fromEntries(tabs.map(([key]) => [key, items.filter(m => m.tab === key).length]));
  const kind = el.fn.replace(/_Ext$/, ' (external)').replace(/Db/, ' database').replace(/Queue/, ' queue');
  panel.querySelector('.panel-inner').innerHTML = `
    <div class="panel-head">
      <div class="row"><h2>${esc(el.label)}</h2><button type="button" data-action="close" aria-label="Close panel">✕</button></div>
      <div class="kind">${esc(kind)}${el.tech ? ' · ' + esc(el.tech) : ''}</div>
      <div class="marker">Marker <code>@realdocs:c4 ${esc(el.path)}</code><button type="button" data-action="copy">Copy</button></div>
      ${el.hasChildren ? `<div class="panel-actions"><button type="button" class="primary" data-action="zoom">${isDescendant(el.alias) ? 'Zoom in to' : 'Go to'} ${esc(el.label)} ${levelNames[levels.get(el.alias).views[0].type]?.split(' · ')[1].toLowerCase() ?? 'details'} ${isDescendant(el.alias) ? '⊕' : '↗'}</button></div>` : ''}
    </div>
    <div role="tablist" aria-label="Element information">
      ${tabs.filter(([key]) => key === 'overview' || counts[key]).map(([key, label]) => `<button type="button" role="tab" id="tab-${key}" aria-controls="tabpanel" aria-selected="${state.tab === key}" data-tab="${key}">${label}${key !== 'overview' ? `<span class="count">${counts[key]}</span>` : ''}</button>`).join('')}
    </div>
    <div role="tabpanel" id="tabpanel" aria-labelledby="tab-${state.tab}" tabindex="0"></div>`;
  const body = panel.querySelector('[role="tabpanel"]');
  saveHash();
  if (state.tab === 'overview') body.innerHTML = overview(el, items);
  else {
    const list = items.filter(m => m.tab === state.tab);
    body.innerHTML = list.map((m, i) => `
      <article class="item">
        <div class="item-head"><strong>${esc(m.title)}</strong>
          ${m.tab === 'diagrams' ? `<button type="button" data-enlarge="${i}">Enlarge</button>` : ''}
          <a href="${esc(m.href)}" target="_blank" rel="noopener">Open in wiki ↗</a></div>
        <div class="source" title="Marker that puts this here:\n${esc(m.marker)}">${esc(m.source)}</div>
        <div class="body ${m.tab === 'diagrams' ? 'diagram' : ''}" data-index="${i}">${m.html ?? '<span class="muted">Rendering…</span>'}</div>
      </article>`).join('');
    if (state.tab === 'diagrams') list.forEach(async (m, i) => {
      const text = m.mermaid ?? markers.find(x => x.target === m.mermaidRef && x.mermaid)?.mermaid;
      try { const { svg } = await mermaid.render(`pd${++renderCount}`, text); body.querySelector(`[data-index="${i}"]`).innerHTML = svg; }
      catch (error) { document.getElementById(`dpd${renderCount}`)?.remove(); body.querySelector(`[data-index="${i}"]`).textContent = 'Could not render this diagram.'; }
    });
    body.querySelectorAll('[data-enlarge]').forEach(button => button.addEventListener('click', () => {
      const m = list[+button.dataset.enlarge];
      const dlg = $('#enlarge');
      dlg.querySelector('strong').textContent = m.title;
      dlg.querySelector('.dlg-body').innerHTML = body.querySelector(`[data-index="${button.dataset.enlarge}"]`).innerHTML;
      dlg.showModal();
    }));
  }
}

function overview(el, items) {
  // Relationships come from the element's own level, even after zooming into it.
  const homeKey = el.path.split('.').slice(-2, -1)[0] ?? '';
  const level = levels.get(homeKey);
  const rels = new Map();
  const chosen = state.variant == null || level !== currentLevel() ? level.views : [level.views[state.variant]];
  for (const view of chosen) for (const rel of view.rels) rels.set(rel.from + '>' + rel.to, rel);
  const out = [...rels.values()].filter(r => r.from === el.alias);
  const inc = [...rels.values()].filter(r => r.to === el.alias);
  const link = alias => `<button type="button" data-goto="${esc(alias)}">${esc(elements.get(alias)?.label ?? alias)}</button>`;
  const rel = (r, other) => `<li>${link(other)} — ${esc(r.label)}${r.tech ? ` <span class="muted">[${esc(r.tech)}]</span>` : ''}</li>`;
  const inViews = views.filter(v => v.elements.has(el.alias));
  return `
    <dl class="facts">
      <dt>Description</dt><dd>${[...el.descriptions].filter(Boolean).map(esc).join('<br><span class="muted">or: </span>')}</dd>
      ${el.tech ? `<dt>Technology</dt><dd>${esc(el.tech)}</dd>` : ''}
      <dt>Marked items</dt><dd>${items.length ? `${items.length} (${tabs.slice(1).map(([k, l]) => `${items.filter(m => m.tab === k).length} ${l.toLowerCase()}`).join(', ')})` : '<span class="empty">None yet. Add the marker above to a guide, section, diagram or file.</span>'}</dd>
    </dl>
    <h3>Calls</h3>${out.length ? `<ul class="rels">${out.map(r => rel(r, r.to)).join('')}</ul>` : '<p class="empty">Nothing in this view.</p>'}
    <h3>Called by</h3>${inc.length ? `<ul class="rels">${inc.map(r => rel(r, r.from)).join('')}</ul>` : '<p class="empty">Nothing in this view.</p>'}
    <h3>Appears in</h3><ul class="rels">${inViews.map(v => `<li>${esc(v.title)}<br><span class="muted">${esc(v.origin)}</span></li>`).join('')}</ul>`;
}

/* ---------------------------------------------------------------------------
 * Events
 * ------------------------------------------------------------------------- */
canvas.addEventListener('click', event => {
  const node = event.target.closest('.c4-shape');
  if (node) select(node.dataset.alias); else closePanel();
});
canvas.addEventListener('dblclick', event => {
  const node = event.target.closest('.c4-shape');
  if (node) zoomIn(node.dataset.alias);
});
canvas.addEventListener('keydown', event => {
  const node = event.target.closest('.c4-shape');
  if (!node) return;
  if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); select(node.dataset.alias); }
  if (event.key === '+' ) zoomIn(node.dataset.alias);
});
let wheelBudget = 0, wheelTimer;
$('.stage').addEventListener('wheel', event => {
  event.preventDefault();
  wheelBudget += event.deltaY;
  clearTimeout(wheelTimer); wheelTimer = setTimeout(() => { wheelBudget = 0; }, 250);
  if (busy) return;
  if (wheelBudget < -120) {
    wheelBudget = 0;
    const node = event.target.closest('.c4-shape.has-children');
    if (node) zoomIn(node.dataset.alias);
  } else if (wheelBudget > 120) { wheelBudget = 0; zoomOut(); }
}, { passive: false });
canvas.addEventListener('mouseover', event => canvas.classList.toggle('zoomable-hover', !!event.target.closest('.has-children')));
$('nav.crumbs').addEventListener('click', event => {
  const button = event.target.closest('button[data-depth]');
  if (button && !button.hasAttribute('aria-current')) zoomOut(+button.dataset.depth);
});
$('.variants').addEventListener('click', async event => {
  const button = event.target.closest('button[data-variant]');
  if (!button) return;
  state.variant = button.dataset.variant === '' ? null : +button.dataset.variant;
  await renderLevel();
  if (state.selected && panel.classList.contains('open')) renderPanel();
});
panel.addEventListener('click', event => {
  const action = event.target.closest('[data-action]')?.dataset.action;
  if (action === 'close') closePanel();
  if (action === 'zoom') { const alias = state.selected; zoomIn(alias); }
  if (action === 'copy') navigator.clipboard?.writeText(`@realdocs:c4 ${elements.get(state.selected).path}`);
  const tab = event.target.closest('[data-tab]');
  if (tab) { state.tab = tab.dataset.tab; renderPanel(); panel.querySelector(`#tab-${state.tab}`).focus(); }
  const goto = event.target.closest('[data-goto]');
  if (goto && nodeFor(goto.dataset.goto)) select(goto.dataset.goto);
});
$('#enlarge button').addEventListener('click', () => $('#enlarge').close());
document.addEventListener('keydown', event => {
  if (event.target.closest('dialog')) return;
  if (event.key === 'Escape' && panel.classList.contains('open')) closePanel();
  if (event.key === 'Backspace' && !event.target.closest('input, textarea')) { event.preventDefault(); zoomOut(); }
});

function saveHash() {
  const params = new URLSearchParams();
  if (state.stack.length > 1) params.set('level', state.stack.slice(1).join(','));
  if (state.selected) params.set('select', state.selected);
  if (state.selected && state.tab !== 'overview') params.set('tab', state.tab);
  history.replaceState(null, '', params.size ? '#' + params : location.pathname);
}
(async () => {
  const params = new URLSearchParams(location.hash.slice(1));
  const deepest = (params.get('level') ?? '').split(',').filter(key => levels.has(key) && elements.has(key)).at(-1);
  if (deepest) state.stack = stackFor(deepest);
  state.variant = defaultVariant();
  await renderLevel();
  if (elements.has(params.get('select'))) { select(params.get('select')); if (params.get('tab')) { state.tab = params.get('tab'); renderPanel(); } }
  window.__ready = true;
})();
</script>
</body>
